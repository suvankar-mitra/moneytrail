spring:
  application:
    name: moneytrail
  profiles:
    active:
      - dev

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:900000}

refresh_token:
  validity_days: 30

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false